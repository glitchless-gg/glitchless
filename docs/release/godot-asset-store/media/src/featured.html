<!doctype html>
<!-- The Godot Asset Store's featured image, for the home page's carousel: 16:9, drawn at 960 x 540 and rendered at 2x
     (1920 x 1080) by ../render.mjs, as a JPEG under the store's 600 KB limit. The carousel shows it beside a 350 px panel with the asset's name, publisher and
     description, so it carries no headline: Glitchy, and the dashboard's real findings for the Godot demo. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="format" content="jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&display=block" rel="stylesheet">
<style>
  :root { --navy: #14213d; --navy-2: #0e182e; --mint: #2ee6a6; --coral: #ff6b57; --mist: #f4f6fa; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 960px; height: 540px; }
  body { position: relative; overflow: hidden; background: radial-gradient(90% 100% at 20% 30%, #22365f 0%, var(--navy) 50%, var(--navy-2) 100%); color: #fff; }
  .shot { position: absolute; left: 330px; top: 72px; width: 740px; height: 416px; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 70px rgba(0, 0, 0, .55); background: var(--mist); transform: rotate(-2deg); transform-origin: left center; }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
  .glitchy { position: absolute; left: 36px; bottom: 50px; height: 320px; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, .45)); }
  .brand { position: absolute; left: 44px; top: 44px; display: flex; align-items: center; gap: 12px; font: 800 30px/1.05 Outfit, sans-serif; letter-spacing: -0.02em; }
  .brand img { width: 56px; height: 56px; }
  .brand em { display: block; font-style: normal; color: var(--mint); }
</style>
</head>
<body>
  <div class="shot"><img src="../captures/findings.png" alt=""></div>
  <div class="brand"><img src="../../../../../assets/brand/glitchless/logo/png/glitchless-icon-128.png" alt=""><span>Glitchless<em>for Godot</em></span></div>
  <img class="glitchy" src="../../../../../assets/brand/glitchless/mascot/on-dark/glitchy-search.png" alt="">
</body>
</html>
