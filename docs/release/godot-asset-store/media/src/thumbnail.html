<!doctype html>
<!-- The Godot Asset Store thumbnail: 16:9, drawn at 960 x 540 and rendered at 2x (1920 x 1080) by ../render.mjs. The
     store's guidelines reject thumbnails dominated by text, so it carries the name and the engine, Glitchy, and what
     the addon measures: every frame's time, a stuttering stretch and then the fixed game holding its budget. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&display=block" rel="stylesheet">
<style>
  :root { --navy: #14213d; --navy-2: #0e182e; --mint: #2ee6a6; --coral: #ff6b57; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 960px; height: 540px; }
  body { position: relative; overflow: hidden; background: radial-gradient(110% 90% at 80% 15%, #1d2e52 0%, var(--navy) 55%, var(--navy-2) 100%); color: #fff; }
  .name { position: absolute; left: 64px; top: 112px; display: flex; align-items: center; gap: 22px; font: 800 92px/1 Outfit, sans-serif; letter-spacing: -0.03em; }
  .name img { width: 104px; height: 104px; }
  .engine { position: absolute; left: 64px; top: 236px; font: 800 64px/1 Outfit, sans-serif; letter-spacing: -0.025em; color: var(--mint); }
  .glitchy { position: absolute; right: 70px; top: 40px; height: 330px; }
  .trace { position: absolute; left: 64px; right: 64px; bottom: 56px; height: 112px; display: flex; align-items: flex-end; gap: 5px; }
  .trace i { flex: 1; border-radius: 2px; }
  .trace i.bad { background: var(--coral); }
  .trace i.ok { background: var(--mint); }
  .budget { position: absolute; left: 64px; right: 64px; bottom: 88px; border-top: 2px dashed rgba(255, 255, 255, .45); }
</style>
</head>
<body>
  <div class="name"><img src="../../../../../assets/brand/glitchless/logo/png/glitchless-icon-256.png" alt="">Glitchless</div>
  <div class="engine">for Godot</div>
  <img class="glitchy" src="../../../../../assets/brand/glitchless/mascot/on-dark/glitchy-search.png" alt="">
  <div class="trace" id="trace"></div>
  <div class="budget"></div>
  <script>
    // Frame times in ms: a stuttering stretch, then the fixed game holding its 16.7 ms budget.
    const before = [17, 18, 34, 17, 52, 19, 18, 61, 22, 17, 45, 18, 70, 19, 38, 17, 58, 21, 18, 66, 17, 48, 19, 17];
    const after = [16, 16, 17, 16, 16, 16, 17, 16, 16, 16, 16, 17, 16, 16, 16, 16, 17, 16, 16, 16, 17, 16];
    const scale = (ms) => Math.min(112, Math.round(ms * 1.6));
    document.getElementById('trace').innerHTML = [
      ...before.map((ms) => `<i class="${ms > 25 ? 'bad' : 'ok'}" style="height:${scale(ms)}px"></i>`),
      ...after.map((ms) => `<i class="ok" style="height:${scale(ms)}px"></i>`),
    ].join('');
  </script>
</body>
</html>
