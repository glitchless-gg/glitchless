<!doctype html>
<!-- Asset Store key image "Cover", 1950 x 1300: drawn at 975 x 650 and rendered at 2x by ../render.mjs. Text allowed
     on it: the title, the publisher's name or logo, and a tagline. -->
<html lang="en">
<head>
<meta name="size" content="975x650">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@800&display=block" rel="stylesheet">
<style>
  :root { --navy: #14213d; --navy-2: #0e182e; --mint: #2ee6a6; --coral: #ff6b57; --fog: #c5d0e4; }
  * { box-sizing: border-box; margin: 0; }
  body { position: relative; overflow: hidden; background: radial-gradient(110% 90% at 80% 15%, #1d2e52 0%, var(--navy) 55%, var(--navy-2) 100%); color: #fff; font-family: Inter, sans-serif; }
  .trace { position: absolute; display: flex; align-items: flex-end; gap: 3px; } .trace i { flex: 1; border-radius: 2px; } .trace i.bad { background: var(--coral); } .trace i.ok { background: var(--mint); }
  html, body { width: 975px; height: 650px; }
  .brand { position: absolute; left: 64px; top: 58px; display: flex; align-items: center; gap: 14px; font: 800 34px/1 Outfit, sans-serif; letter-spacing: -0.02em; }
  .brand img { width: 52px; height: 52px; }
  h1 { position: absolute; left: 64px; top: 150px; font: 800 66px/1.03 Outfit, sans-serif; letter-spacing: -0.025em; }
  h1 em { font-style: normal; color: var(--mint); }
  p { position: absolute; left: 64px; top: 310px; font-size: 21px; line-height: 1.45; color: var(--fog); }
  .glitchy { position: absolute; right: 60px; top: 70px; height: 330px; }
  .trace { left: 64px; right: 64px; bottom: 74px; height: 150px; }
</style>
</head>
<body>
  <div class="brand"><img src="../../../../../assets/brand/glitchless/logo/png/glitchless-icon-128.png" alt="">Glitchless</div>
  <h1>Game observability<br>for <em>Unity</em></h1>
  <p>Stutter and its cause, errors and bug reports<br>from real players. Your coding agent<br>gets the data to fix it.</p>
  <img class="glitchy" src="../../../../../assets/brand/glitchless/mascot/on-dark/glitchy-search.png" alt="">
  <div class="trace" id="trace"></div>
  <script>
    // Frame times in ms: a stuttering stretch (garbage collection, shader compiles), then the fixed game holding 16.7 ms.
    const before = [17, 18, 34, 17, 52, 19, 18, 61, 22, 17, 45, 18, 70, 19, 38, 17, 58, 21, 18, 66, 17, 48, 19, 17, 63, 18, 41, 17, 19, 72, 18, 17, 55, 20];
    const after = [16, 16, 17, 16, 16, 16, 17, 16, 16, 16, 16, 17, 16, 16, 16, 16, 17, 16, 16, 16, 17, 16, 16, 16, 16, 17, 16, 16, 16, 16];
    const el = document.getElementById("trace"), h = el.clientHeight, scale = (ms) => Math.min(h, Math.round(ms * h / 74));
    el.innerHTML = [...before.map((ms) => `<i class="${ms > 25 ? "bad" : "ok"}" style="height:${scale(ms)}px"></i>`), ...after.map((ms) => `<i class="ok" style="height:${scale(ms)}px"></i>`)].join("");
  </script>
</body>
</html>
