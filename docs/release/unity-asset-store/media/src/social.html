<!doctype html>
<!-- Asset Store key image "Social Media", 1200 x 630: drawn at 600 x 315 and rendered at 2x. No text. -->
<html lang="en">
<head>
<meta name="size" content="600x315">
<style>
  :root { --navy: #14213d; --navy-2: #0e182e; --mint: #2ee6a6; --coral: #ff6b57; --fog: #c5d0e4; }
  * { box-sizing: border-box; margin: 0; }
  body { position: relative; overflow: hidden; background: radial-gradient(110% 90% at 80% 15%, #1d2e52 0%, var(--navy) 55%, var(--navy-2) 100%); color: #fff; font-family: Inter, sans-serif; }
  .trace { position: absolute; display: flex; align-items: flex-end; gap: 3px; } .trace i { flex: 1; border-radius: 2px; } .trace i.bad { background: var(--coral); } .trace i.ok { background: var(--mint); }
  html, body { width: 600px; height: 315px; }
  .glitchy { position: absolute; left: 50%; top: 22px; height: 170px; transform: translateX(-50%); }
  .trace { left: 40px; right: 40px; bottom: 28px; height: 90px; gap: 2px; }
</style>
</head>
<body>
  <img class="glitchy" src="../../../../../assets/brand/glitchless/mascot/on-dark/glitchy-search.png" alt="">
  <div class="trace" id="trace"></div>
  <script>
    // Frame times in ms: a stuttering stretch (garbage collection, shader compiles), then the fixed game holding 16.7 ms.
    const before = [17, 18, 34, 17, 52, 19, 18, 61, 22, 17, 45, 18, 70, 19, 38, 17, 58, 21, 18, 66, 17, 48, 19, 17, 63, 18, 41, 17, 19, 72, 18, 17, 55, 20];
    const after = [16, 16, 17, 16, 16, 16, 17, 16, 16, 16, 16, 17, 16, 16, 16, 16, 17, 16, 16, 16, 17, 16, 16, 16, 16, 17, 16, 16, 16, 16];
    const el = document.getElementById("trace"), h = el.clientHeight, scale = (ms) => Math.min(h, Math.round(ms * h / 74));
    el.innerHTML = [...before.map((ms) => `<i class="${ms > 25 ? "bad" : "ok"}" style="height:${scale(ms)}px"></i>`), ...after.map((ms) => `<i class="ok" style="height:${scale(ms)}px"></i>`)].join("");
  </script>
</body>
</html>
