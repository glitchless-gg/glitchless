<!doctype html>
<!-- The Fab listing's thumbnail: 16:9, drawn at 960 x 540 and rendered at 2x (1920 x 1080) by ../render.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@800&display=block" rel="stylesheet">
<style>
  :root { --navy: #14213d; --navy-2: #0e182e; --mint: #2ee6a6; --coral: #ff6b57; --fog: #c5d0e4; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 960px; height: 540px; }
  body { position: relative; overflow: hidden; background: radial-gradient(110% 90% at 80% 15%, #1d2e52 0%, var(--navy) 55%, var(--navy-2) 100%); color: #fff; font-family: Inter, sans-serif; }
  .brand { position: absolute; left: 56px; top: 46px; display: flex; align-items: center; gap: 12px; font: 800 28px/1 Outfit, sans-serif; letter-spacing: -0.02em; }
  .brand img { width: 42px; height: 42px; }
  h1 { position: absolute; left: 56px; top: 122px; font: 800 58px/1.03 Outfit, sans-serif; letter-spacing: -0.025em; }
  h1 em { font-style: normal; color: var(--mint); }
  p { position: absolute; left: 56px; top: 262px; font-size: 19px; line-height: 1.45; color: var(--fog); }
  .meta { position: absolute; left: 56px; top: 336px; font: 600 14px/1 Inter, sans-serif; letter-spacing: .02em; color: var(--mint); }
  .glitchy { position: absolute; right: 64px; top: 44px; height: 300px; }
  .trace { position: absolute; left: 56px; right: 56px; bottom: 70px; height: 104px; display: flex; align-items: flex-end; gap: 4px; }
  .trace i { flex: 1; border-radius: 2px; }
  .trace i.bad { background: var(--coral); }
  .trace i.ok { background: var(--mint); }
  .budget { position: absolute; left: 56px; right: 56px; bottom: 100px; border-top: 1.5px dashed rgba(255, 255, 255, .45); }
  .label { position: absolute; bottom: 40px; font: 500 14px/1 ui-monospace, Menlo, monospace; }
  .label.l { left: 56px; color: var(--coral); }
  .label.r { right: 56px; color: var(--mint); }
</style>
</head>
<body>
  <div class="brand"><img src="../../../../../assets/brand/glitchless/logo/png/glitchless-icon-128.png" alt="">Glitchless</div>
  <h1>Game observability<br>for <em>Unreal</em></h1>
  <p>Stutter and its cause, crashes, ensures and bug reports<br>from real players. Your coding agent gets the data to fix it.</p>
  <div class="meta">Unreal Engine 5.8 · C++ and Blueprint · MCP · Free</div>
  <img class="glitchy" src="../../../../../assets/brand/glitchless/mascot/on-dark/glitchy-search.png" alt="">
  <div class="trace" id="trace"></div>
  <div class="budget"></div>
  <span class="label l">pso_compile · gc · map_load</span>
  <span class="label r">after: 60 fps</span>
  <script>
    // Frame times in ms: a stuttering stretch, then the fixed game holding its 16.7 ms budget.
    const before = [17, 18, 34, 17, 52, 19, 18, 61, 22, 17, 45, 18, 70, 19, 38, 17, 58, 21, 18, 66, 17, 48, 19, 17, 63, 18, 41, 17, 19, 72, 18, 17, 55, 20];
    const after = [16, 16, 17, 16, 16, 16, 17, 16, 16, 16, 16, 17, 16, 16, 16, 16, 17, 16, 16, 16, 17, 16, 16, 16, 16, 17, 16, 16, 16, 16];
    const scale = (ms) => Math.min(104, Math.round(ms * 1.4));
    document.getElementById('trace').innerHTML = [
      ...before.map((ms) => `<i class="${ms > 25 ? 'bad' : 'ok'}" style="height:${scale(ms)}px"></i>`),
      ...after.map((ms) => `<i class="ok" style="height:${scale(ms)}px"></i>`),
    ].join('');
  </script>
</body>
</html>
