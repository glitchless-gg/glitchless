<!doctype html>
<!-- The Asset Store publisher profile's promo banner: 3:2, drawn at 975 x 650 and rendered at 2x
     (1950 x 1300, the size of Unity's product cover images) by render-banner.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@800&display=block" rel="stylesheet">
<style>
  :root { --navy: #14213d; --navy-2: #0e182e; --mint: #2ee6a6; --coral: #ff6b57; --fog: #c5d0e4; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 975px; height: 650px; }
  body { position: relative; overflow: hidden; background: radial-gradient(110% 85% at 82% 18%, #1d2e52 0%, var(--navy) 55%, var(--navy-2) 100%); color: #fff; font-family: Inter, sans-serif; }
  .brand { position: absolute; left: 60px; top: 54px; display: flex; align-items: center; gap: 13px; font: 800 30px/1 Outfit, sans-serif; letter-spacing: -0.02em; }
  .brand img { width: 46px; height: 46px; }
  h1 { position: absolute; left: 60px; top: 146px; font: 800 56px/1.04 Outfit, sans-serif; letter-spacing: -0.025em; }
  h1 em { font-style: normal; color: var(--mint); }
  p { position: absolute; left: 60px; top: 288px; font-size: 20px; line-height: 1.45; color: var(--fog); }
  .meta { position: absolute; left: 60px; top: 372px; font: 600 15px/1 Inter, sans-serif; letter-spacing: .02em; color: var(--mint); }
  .glitchy { position: absolute; right: 78px; top: 58px; height: 318px; }
  .trace { position: absolute; left: 60px; right: 60px; bottom: 92px; height: 132px; display: flex; align-items: flex-end; gap: 4px; }
  .trace i { flex: 1; border-radius: 2px; }
  .trace i.bad { background: var(--coral); }
  .trace i.ok { background: var(--mint); }
  .budget { position: absolute; left: 60px; right: 60px; bottom: 128px; border-top: 1.5px dashed rgba(255, 255, 255, .45); }
  .label { position: absolute; bottom: 56px; font: 500 15px/1 ui-monospace, Menlo, monospace; }
  .label.l { left: 60px; color: var(--coral); }
  .label.r { right: 60px; color: var(--mint); }
</style>
</head>
<body>
  <div class="brand"><img src="../logo/png/glitchless-icon-128.png" alt="">Glitchless</div>
  <h1>Game observability<br>for <em>Unity</em></h1>
  <p>Stutter, crashes and where players quit.<br>Your coding agent gets the data to fix it.</p>
  <div class="meta">Unity 6.3 LTS and later · MCP · MIT</div>
  <img class="glitchy" src="../mascot/on-dark/glitchy-search.png" alt="">
  <div class="trace" id="trace"></div>
  <div class="budget"></div>
  <span class="label l">before: hitches</span>
  <span class="label r">after: 60 fps</span>
  <script>
    // Frame times in ms: a stuttering stretch, then the fixed game holding its 16.7 ms budget.
    const before = [17, 18, 34, 17, 52, 19, 18, 61, 22, 17, 45, 18, 70, 19, 38, 17, 58, 21, 18, 66, 17, 48, 19, 17, 63, 18, 41, 17, 19, 72, 18, 17, 55, 20];
    const after = [16, 16, 17, 16, 16, 16, 17, 16, 16, 16, 16, 17, 16, 16, 16, 16, 17, 16, 16, 16, 17, 16, 16, 16, 16, 17, 16, 16, 16, 16];
    const scale = (ms) => Math.min(132, Math.round(ms * 1.8));
    document.getElementById('trace').innerHTML = [
      ...before.map((ms) => `<i class="${ms > 25 ? 'bad' : 'ok'}" style="height:${scale(ms)}px"></i>`),
      ...after.map((ms) => `<i class="ok" style="height:${scale(ms)}px"></i>`),
    ].join('');
  </script>
</body>
</html>
