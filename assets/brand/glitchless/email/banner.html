<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glitchless email banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap">
<style>
/* The banner at the top of Glitchless's welcome and product emails: 600 x 220 in the email, rendered at 2x. The logo
   and line on the left, Glitchy waving on the right, and the brand's frame-time strip along the bottom: uneven bars
   with one coral stutter, the agent's fix, then short even mint bars. */
:root { --mint: #2EE6A6; --navy: #14213D; --coral: #FF6B57; --slate: #3B4C74; --rule: #2A3A60; --onNight2: #B9C2D6 }
* { box-sizing: border-box; margin: 0 }
html, body { width: 600px; height: 220px; overflow: hidden; background: var(--navy) }
body { position: relative; background: radial-gradient(circle at 80% 58%, rgba(46, 230, 166, 0.16), transparent 42%), var(--navy) }
.logo { position: absolute; left: 36px; top: 38px; height: 34px }
.line { position: absolute; left: 37px; top: 84px; font: 500 14px/1.3 "Inter", -apple-system, sans-serif; color: var(--onNight2) }
.strip { position: absolute; left: 36px; bottom: 0; width: 300px; height: 74px; display: flex; align-items: flex-end; gap: 6px }
.strip i { flex: 1; background: var(--slate); border-radius: 3px 3px 0 0 }
.strip i.hot { background: var(--coral) }
.strip i.ok { background: var(--mint) }
.strip b { width: 0; align-self: stretch; border-left: 2px dashed rgba(255, 255, 255, 0.55); margin: 8px 4px 0 }
.glitchy { position: absolute; right: 34px; bottom: -14px; height: 214px }
</style>
</head>
<body>
<img class="logo" src="../logo/png/glitchless-lockup-dark.png" alt="">
<p class="line">See how your game plays for real players.</p>
<div class="strip" id="strip"></div>
<img class="glitchy" src="../mascot/on-dark/glitchy-wave.png" alt="">
<script>
const strip = document.getElementById('strip');
const add = (h, cls) => { const i = document.createElement('i'); i.style.height = `${h}%`; if (cls) i.className = cls; strip.append(i); };
[34, 42, 30, 100, 38, 46].forEach((h, n) => add(h, n === 3 ? 'hot' : ''));
strip.append(document.createElement('b'));
[20, 21, 19, 20, 21, 20].forEach((h) => add(h, 'ok'));
</script>
</body>
</html>
