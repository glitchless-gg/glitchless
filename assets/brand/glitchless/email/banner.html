<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glitchless email banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Outfit:wght@800&display=block">
<style>
/* The banner at the top of Glitchless's welcome and product emails: 600 x 220 in the email, rendered at 2x. The logo,
   the headline the site leads with and one line under it on the left, Glitchy waving on the right, and a players
   strip along the bottom: how many players are still playing, level by level, with the one level where most stop in
   coral. It stands for the whole player experience, where frame times alone stood before. */
:root { --mint: #2EE6A6; --navy: #14213D; --coral: #FF6B57; --slate: #3B4C74; --onNight: #F7F8FB; --onNight2: #B9C2D6 }
* { box-sizing: border-box; margin: 0 }
html, body { width: 600px; height: 220px; overflow: hidden; background: var(--navy) }
body { position: relative; background: radial-gradient(circle at 82% 58%, rgba(46, 230, 166, 0.16), transparent 42%), var(--navy) }
.logo { position: absolute; left: 36px; top: 26px; height: 28px }
h1 { position: absolute; left: 35px; top: 66px; font: 800 27px/1.02 "Outfit", sans-serif; letter-spacing: -0.02em; color: var(--onNight) }
h1 em { font-style: normal; color: var(--mint) }
.line { position: absolute; left: 36px; top: 128px; width: 330px; font: 500 12.5px/1.35 "Inter", -apple-system, sans-serif; color: var(--onNight2) }
.strip { position: absolute; left: 36px; bottom: 0; width: 300px; height: 38px; display: flex; align-items: flex-end; gap: 6px }
.strip i { flex: 1; background: var(--mint); border-radius: 3px 3px 0 0; opacity: 0.9 }
.strip i.stop { background: var(--coral); opacity: 1 }
.glitchy { position: absolute; right: 34px; bottom: -14px; height: 214px }
</style>
</head>
<body>
<img class="logo" src="../logo/png/glitchless-lockup-dark.png" alt="">
<h1>Let your agent<br><em>understand your players.</em></h1>
<p class="line">Where players stop, what they play and buy, and what lags or crashes, for your coding agent to fix.</p>
<div class="strip" id="strip"></div>
<img class="glitchy" src="../mascot/on-dark/glitchy-wave.png" alt="">
<script>
// Players still playing at each level, as a share of those who started: the drop at the fourth is where most stop.
const strip = document.getElementById('strip');
[100, 94, 88, 52, 47, 44, 42, 40].forEach((h, n) => {
  const i = document.createElement('i');
  i.style.height = `${h}%`;
  if (n === 3) i.className = 'stop';
  strip.append(i);
});
</script>
</body>
</html>
