[SystemSettings]
; PLANTED PROBLEM 1 (with Content/Demo/M_Fireworks_*): PSO precaching is off, as in many projects brought over
; from UE4, so the first fireworks create their pipeline states while the frame waits. Glitchless reports a
; pso_compile hitch on gallery and says to turn precaching back on and ship a bundled PSO cache. The fix: delete
; this line.
r.PSOPrecaching=0

[/Script/Engine.GarbageCollectionSettings]
; Unreal collects garbage every 61 s; the demo does it every 15 s so a one-minute bot run sees the spikes that
; planted problem 2 (DemoDirector.cpp, the forge's sparks) causes. It makes them more frequent, not bigger.
gc.TimeBetweenPurgingPendingKillObjects=15

