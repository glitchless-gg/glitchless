<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comet Garden (Glitchless Babylon.js demo)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1026; font-family: system-ui, sans-serif; }
      #game { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
      #hud { position: fixed; top: 12px; left: 16px; color: #f4f1de; font-size: 15px; text-shadow: 0 1px 2px #000; pointer-events: none; }
      #hud b { color: #ffd166; }
      #banner { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #f4f1de; font-size: 28px; text-shadow: 0 2px 6px #000; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="banner"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
